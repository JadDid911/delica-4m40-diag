[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "delica-4m40-diag"
version = "0.1.0"
description = "Read-only live data, graphs and AI-ready logs for 1997-2001 Delica Space Gear 4M40 EFI gearbox and engine computers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: System :: Hardware",
  "Intended Audience :: End Users/Desktop",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
delica-log = "delica_mut.log:main"
delica-decode = "delica_mut.decode:main"
delica-live = "delica_mut.live:main"
delica-ai = "delica_mut.ai:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["delica_mut*"]

[tool.setuptools.package-data]
delica_mut = ["web/*.html", "_vendor/kkl/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
